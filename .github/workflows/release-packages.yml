  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - prepare
      - windows
      - macos
      - linux
      - android
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          LANZOU_MIRRORS_JSON: ${{ vars.LANZOU_MIRRORS_JSON }}
        run: |
          set +e
          cp "docs/releases/${RELEASE_VERSION}.md" release-notes.md || exit 1

          setup_asset="zsclip-v${RELEASE_VERSION}-setup.exe"
          no_lan_setup_asset="zsclip-v${RELEASE_VERSION}-setup-no-lan.exe"
          resource_asset="zsclip-v${RELEASE_VERSION}-resources.zip"
          required_assets=(
            "$setup_asset"
            "$no_lan_setup_asset"
            zsclip-windows-x86_64-portable.zip
            zsclip-windows-x86_64-no-lan-portable.zip
            "$resource_asset"
            zsclip-android-test.apk
            zsclip-macos-arm64.dmg
            zsclip-macos-x86_64.dmg
            zsclip-linux-x86_64.deb
            zsclip-linux-x86_64.tar.gz
          )
          set -euo pipefail
          python3 - "${required_assets[@]}" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import quote, urlsplit

          assets = Path(os.environ.get("UPDATE_ASSETS_DIR", "release-assets"))
          version = os.environ["RELEASE_VERSION"]
          repository = os.environ["GH_REPO"]
          tag = quote(os.environ["TAG_NAME"], safe="")
          names = sys.argv[1:]
          hashes = {}
          for name in names:
              path = assets / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty release package: {name}")
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              hashes[name] = digest.hexdigest()

          def installer(name):
              size = (assets / name).stat().st_size
              if not 4096 <= size <= 512 * 1024 * 1024:
                  raise SystemExit(f"Installer size is outside updater limits: {name}")
              return {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(name, safe='')}",
                  "file_name": name,
                  "sha256": hashes[name],
                  "size": size,
              }

          windows_names = [f"zsclip-v{version}-setup.exe", f"zsclip-v{version}-setup-no-lan.exe"]
          manifest = {
              "format": "zsclip-update-v1",
              "version": version,
              "page_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "notes": Path(os.environ.get("UPDATE_NOTES_FILE", "release-notes.md")).read_text(encoding="utf-8"),
              "windows_x64": installer(windows_names[0]),
              "windows_x64_no_lan": installer(windows_names[1]),
          }
          manifest_path = assets / "zsclip-update.json"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if manifest_path.stat().st_size > 128 * 1024:
              raise SystemExit("Update manifest exceeds updater size limit")

          mirror_path = assets / "mirrors.json"
          mirror_path.unlink(missing_ok=True)
          configured = os.environ.get("LANZOU_MIRRORS_JSON", "").strip()
          if configured:
              mirrors = json.loads(configured)
              if not isinstance(mirrors, dict):
                  raise SystemExit("LANZOU_MIRRORS_JSON must be a JSON object")
              if mirrors.get("version") != version:
                  print("::warning::Skipping LANZOU_MIRRORS_JSON for a different release version")
              else:
                  files = mirrors.get("files")
                  if not isinstance(files, list) or not files:
                      raise SystemExit("LANZOU_MIRRORS_JSON requires at least one uploaded public installer")
                  normalized = []
                  seen = set()
                  for entry in files:
                      if not isinstance(entry, dict):
                          raise SystemExit("Invalid mirror entry")
                      name = entry.get("name")
                      share_url = entry.get("share_url")
                      code = entry.get("code", "")
                      if not isinstance(name, str) or name not in windows_names or name in seen:
                          raise SystemExit("Mirror name must uniquely match a Windows installer in this release")
                      if not isinstance(share_url, str) or len(share_url) > 4096:
                          raise SystemExit("Mirror requires an actual public share URL")
                      share = urlsplit(share_url)
                      if (share.scheme != "https" or share.netloc not in ("ilanzou.com", "www.ilanzou.com")
                              or not re.fullmatch(r"/s/[A-Za-z0-9_-]{1,128}", share.path)
                              or share.query or share.fragment or code != ""):
                          raise SystemExit("Mirror must be a public HTTPS ilanzou share without an extraction code")
                      seen.add(name)
                      normalized.append({"name": name, "share_url": share_url, "code": ""})
                  mirror_path.write_text(json.dumps({"version": version, "files": normalized}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  if mirror_path.stat().st_size > 128 * 1024:
                      raise SystemExit("Mirror manifest exceeds updater size limit")

          metadata = [manifest_path] + ([mirror_path] if mirror_path.is_file() else [])
          for path in metadata:
              hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (assets / "SHA256SUMS.txt").write_text(
              "".join(f"{hashes[name]}  {name}\n" for name in sorted(hashes)), encoding="utf-8"
          )
          print(f"Prepared {len(hashes)} checksums and the Windows update manifest")
          PY
          required_assets+=(SHA256SUMS.txt zsclip-update.json)
          if [ -f release-assets/mirrors.json ]; then
            required_assets+=(mirrors.json)
          fi
          release_asset_paths=()
          for asset in "${required_assets[@]}"; do
            release_asset_paths+=("release-assets/$asset")
          done
          set +e

          ls -lah release-assets
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              "${release_asset_paths[@]}" \
              --repo "$GH_REPO" \
              --clobber 2>&1 | tee release-upload.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              gh release edit "$TAG_NAME" --repo "$GH_REPO" --target "$GITHUB_SHA" --notes-file release-notes.md 2>&1 | tee -a release-upload.log
              status=${PIPESTATUS[0]}
            fi
          else
            gh release create "$TAG_NAME" \
              "${release_asset_paths[@]}" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "ZSClip $TAG_NAME" \
              --notes-file release-notes.md 2>&1 | tee release-upload.log
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 160 release-upload.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=GitHub release upload failed::$message"
            exit "$status"
          fi
          gh release view "$TAG_NAME" --repo "$GH_REPO" --json tagName,targetCommitish,assets --jq '.tagName + " " + (.targetCommitish // "") + "\n" + (.assets[].name)' | tee release-verify.log
          for required in "${required_assets[@]}"; do
            if ! grep -Fx "$required" release-verify.log >/dev/null; then
              echo "::error title=GitHub release verification failed::Missing release asset $required"
              exit 1
            fi
          done
          for required in "${required_assets[@]}"; do
            url="https://github.com/${GH_REPO}/releases/download/${TAG_NAME}/${required}"
            code="000"
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -I -L -s -o /dev/null -w '%{http_code}' "$url")"
              if [ "$code" = "200" ]; then
                break
              fi
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error title=GitHub release public download failed::${required} returned HTTP ${code}"
              exit 1
            fi
          done
