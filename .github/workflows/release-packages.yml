name: Release Packages

env:
  CARGO_NET_RETRY: "10"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build"
        required: false
        default: "1.0.9"
  push:
    tags:
      - "0.*"
      - "1.*"

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      mac_short_version: ${{ steps.version.outputs.mac_short_version }}
      mac_bundle_version: ${{ steps.version.outputs.mac_bundle_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t app_versions < <(sed -nE 's/^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?const[[:space:]]+APP_VERSION:[[:space:]]*&str[[:space:]]*=[[:space:]]*"([^"]+)";[[:space:]]*$/\3/p' src/app_version.rs)
          if [ "${#app_versions[@]}" -ne 1 ]; then
            echo "::error title=Invalid APP_VERSION::Expected exactly one APP_VERSION declaration in src/app_version.rs"
            exit 1
          fi
          app_version="${app_versions[0]}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            release_version="$REF_NAME"
          else
            release_version="$app_version"
          fi

          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid APP_VERSION::$app_version is not a three- or four-part numeric version"
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid release version::$release_version is not a three- or four-part numeric version"
            exit 1
          fi
          if [ "$release_version" != "$app_version" ]; then
            echo "::error title=Release version mismatch::Requested $release_version but APP_VERSION is $app_version"
            exit 1
          fi

          IFS='.' read -r version_major version_minor version_patch version_revision <<< "$release_version"
          version_revision=${version_revision:-0}
          version_major=$((10#$version_major))
          version_minor=$((10#$version_minor))
          version_patch=$((10#$version_patch))
          version_revision=$((10#$version_revision))
          mac_bundle_epoch=$((version_major * 100 + version_minor + 1))
          if (( mac_bundle_epoch > 9999 || version_patch > 99 || version_revision > 99 )); then
            echo "::error title=Unsupported macOS version::$release_version cannot be represented as a legal three-part CFBundleVersion"
            exit 1
          fi
          mac_short_version="$version_major.$version_minor.$version_patch"
          mac_bundle_version="$mac_bundle_epoch.$version_patch.$version_revision"

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "mac_short_version=$mac_short_version" >> "$GITHUB_OUTPUT"
          echo "mac_bundle_version=$mac_bundle_version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $release_version" >> "$GITHUB_STEP_SUMMARY"
          echo "macOS versions: short=$mac_short_version, bundle=$mac_bundle_version" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows release package
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout zsui dependency
        shell: pwsh
        run: |
          $revision = (Get-Content zsui-revision.txt -Raw).Trim()
          git init ../zsui
          git -C ../zsui remote add origin https://github.com/qiu7824/zsui
          git -C ../zsui fetch --depth 1 origin $revision
          git -C ../zsui checkout --detach FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows regressions
        shell: pwsh
        run: |
          cargo test --release --locked --bin zsclip -- --test-threads=1
          exit $LASTEXITCODE
      - name: Build Windows release
        shell: pwsh
        run: |
          $status = 1
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Output "cargo build attempt $attempt/3"
            cargo build --release --locked
            $status = $LASTEXITCODE
            if ($status -eq 0) {
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit $status
      - name: Install Windows packaging tools
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Stage Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\zsclip-windows-x86_64 | Out-Null
          New-Item -ItemType Directory -Force dist\installer-source | Out-Null
          Copy-Item target\release\zsclip.exe dist\zsclip-windows-x86_64\剪贴板.exe
          Copy-Item target\release\zsclip.exe dist\installer-source\剪贴板.exe
          $installText = @'
          剪贴板 __RELEASE_VERSION__ - Windows

          安装/运行:
          1. 解压此 zip 到你要长期使用的安装目录，例如 D:\剪贴板。
          2. 双击 剪贴板.exe 运行。
          3. 如果 Windows SmartScreen 提示未知发布者，选择“更多信息”后继续运行。

          说明:
          - 当前包是便携版，不写注册表，不包含安装向导。
          - 开机自启、托盘、热键等功能在应用设置里启用。
          '@
          $installText.Replace('__RELEASE_VERSION__', $env:RELEASE_VERSION) |
            Set-Content -Encoding UTF8 dist\zsclip-windows-x86_64\INSTALL.txt
          Copy-Item dist\zsclip-windows-x86_64\INSTALL.txt dist\installer-source\INSTALL.txt
          Compress-Archive -Path dist\zsclip-windows-x86_64\* -DestinationPath dist\zsclip-windows-x86_64-portable.zip -Force
          $installerScript = @'
          #define MyAppName "剪贴板"
          #define MyAppVersion "__RELEASE_VERSION__"
          #define MyAppPublisher "qiu7824"
          #define MyAppURL "https://github.com/qiu7824/zsclip"
          #define MyAppExeName "剪贴板.exe"
          #define MyAppInstallDirName "剪贴板"
          #define MyAppAutoStartValueName "ZSClip"
          #define MySourceDir "dist\installer-source"
          #define MyOutputDir "dist"
          #define MySetupIcon "assets\icons\icon.ico"

          [Setup]
          AppId={{8D6C8C7D-1F0A-4E5A-9A24-7F4F5C1E9A11}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={code:GetDefaultInstallDir}
          CreateAppDir=yes
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          OutputDir={#MyOutputDir}
          OutputBaseFilename=zsclip-v{#MyAppVersion}-setup
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          SetupLogging=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          CloseApplications=yes
          CloseApplicationsFilter={#MyAppExeName},zsclip.exe
          RestartApplications=no
          VersionInfoVersion={#MyAppVersion}
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoProductName={#MyAppName}
          VersionInfoDescription={#MyAppName}
          VersionInfoProductVersion={#MyAppVersion}
          SetupIconFile={#MySetupIcon}

          [Languages]
          Name: "chinesesimplified"; MessagesFile: ".github\inno\ChineseSimplified.isl"

          [Messages]
          ButtonBack=< 上一步(&B)
          ButtonNext=下一步(&N) >
          ButtonInstall=安装(&I)
          ButtonOK=确定
          ButtonCancel=取消
          ButtonYes=是(&Y)
          ButtonNo=否(&N)
          ButtonFinish=完成(&F)
          ButtonBrowse=浏览(&B)...
          ButtonWizardBrowse=浏览(&R)...
          ClickNext=单击“下一步”继续，或单击“取消”退出安装程序。
          WelcomeLabel1=欢迎使用 [name] 安装向导
          WelcomeLabel2=这将在你的电脑上安装 [name/ver]。%n%n建议继续前关闭其他应用程序。
          WizardSelectDir=选择安装位置
          SelectDirDesc=要将 [name] 安装到哪里？
          SelectDirLabel3=安装程序会将 [name] 安装到以下文件夹。
          SelectDirBrowseLabel=单击“下一步”继续。如需选择其他文件夹，请单击“浏览”。
          DiskSpaceMBLabel=至少需要 [mb] MB 可用磁盘空间。
          DirExistsTitle=文件夹已存在
          DirExists=文件夹：%n%n%1%n%n已经存在。是否仍安装到该文件夹？
          DirDoesntExistTitle=文件夹不存在
          DirDoesntExist=文件夹：%n%n%1%n%n不存在。是否创建该文件夹？
          WizardSelectTasks=选择附加任务
          SelectTasksDesc=要执行哪些附加任务？
          SelectTasksLabel2=请选择安装 [name] 时要执行的附加任务，然后单击“下一步”。
          WizardReady=准备安装
          ReadyLabel1=安装程序已准备好开始将 [name] 安装到你的电脑。
          ReadyLabel2a=单击“安装”继续，或单击“上一步”检查或修改设置。
          ReadyLabel2b=单击“安装”继续。
          ReadyMemoDir=安装位置：
          ReadyMemoGroup=开始菜单文件夹：
          ReadyMemoTasks=附加任务：
          WizardPreparing=正在准备安装
          PreparingDesc=安装程序正在准备将 [name] 安装到你的电脑。
          WizardInstalling=正在安装
          InstallingLabel=请稍候，安装程序正在将 [name] 安装到你的电脑。
          FinishedHeadingLabel=[name] 安装向导完成
          FinishedLabelNoIcons=安装程序已完成 [name] 的安装。
          FinishedLabel=安装程序已完成 [name] 的安装。你可以通过已安装的快捷方式启动应用。
          ClickFinish=单击“完成”退出安装程序。
          RunEntryExec=运行 %1
          StatusCreateDirs=正在创建目录...
          StatusExtractFiles=正在解压文件...
          StatusCreateIcons=正在创建快捷方式...
          StatusCreateRegistryEntries=正在写入注册表...
          StatusSavingUninstall=正在保存卸载信息...
          StatusRunProgram=正在完成安装...

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加任务:"; Flags: unchecked
          Name: "autostart"; Description: "启用开机自启"; GroupDescription: "启动选项:"; Flags: unchecked

          [Files]
          Source: "{#MySourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs; Excludes: "\Output\*,\.git\*,\.github\*,\target\*,\__pycache__\*,\build\*,\dist\*,\installer\*,\venv\*,\.venv\*,\node_modules\*,\*.iss,*.pyc,*.pyo"

          [Dirs]
          Name: "{app}\data"
          Name: "{app}\data\temp"
          Name: "{app}\data\logs"

          [InstallDelete]
          Type: files; Name: "{autoprograms}\ZSClip.lnk"
          Type: files; Name: "{autodesktop}\ZSClip.lnk"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Registry]
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: string; ValueName: "{#MyAppAutoStartValueName}"; ValueData: """{app}\{#MyAppExeName}"""; Flags: uninsdeletevalue; Tasks: autostart
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: none; ValueName: "{#MyAppAutoStartValueName}"; Flags: deletevalue; Check: ShouldDisableAutostart
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: none; ValueName: "{#MyAppName}"; Flags: deletevalue; Check: ShouldDisableAutostart
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: none; ValueName: "Clipboard"; Flags: deletevalue; Check: ShouldDisableAutostart
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: none; ValueName: "筑森剪贴"; Flags: deletevalue; Check: ShouldDisableAutostart

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Flags: nowait runasoriginaluser; Check: IsAutomaticUpdate
          Filename: "{app}\{#MyAppExeName}"; Description: "立即运行 {#MyAppName}"; Flags: nowait postinstall skipifsilent runasoriginaluser; Check: IsInteractiveInstall

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\logs"
          Type: filesandordirs; Name: "{app}\temp"

          [Code]
          type
            TShutdownTarget = record
              Window: HWND;
              Process: THandle;
              ProcessId: DWORD;
            end;
            TShutdownTargets = array of TShutdownTarget;

          function FindMainWindow(Parent, After: HWND; ClassName: String; WindowName: THandle): HWND;
            external 'FindWindowExW@user32.dll stdcall';
          function WindowProcessId(Window: HWND; var ProcessId: DWORD): DWORD;
            external 'GetWindowThreadProcessId@user32.dll stdcall';
          function OpenShutdownProcess(Access: DWORD; Inherit: Integer; ProcessId: DWORD): THandle;
            external 'OpenProcess@kernel32.dll stdcall';
          function ProcessImageName(Process: THandle; Flags: DWORD; Name: String; var Size: DWORD): Integer;
            external 'QueryFullProcessImageNameW@kernel32.dll stdcall';
          function WaitForShutdown(Process: THandle; Milliseconds: DWORD): DWORD;
            external 'WaitForSingleObject@kernel32.dll stdcall';
          function CloseShutdownHandle(Handle: THandle): Integer;
            external 'CloseHandle@kernel32.dll stdcall';
          function PostShutdownMessage(Window: HWND; Message: UINT; WParam, LParam: THandle): Integer;
            external 'PostMessageW@user32.dll stdcall';
          function OpenReplacementFile(Name: String; Access, Sharing: DWORD; Security: THandle;
            Creation, Attributes: DWORD; Template: THandle): THandle;
            external 'CreateFileW@kernel32.dll stdcall';

          var
            AutoStartTaskInitialized: Boolean;

          function IsAutomaticUpdate(): Boolean;
          begin
            Result := ExpandConstant('{param:ZSCLIPUPDATE|0}') = '1';
          end;

          function IsInteractiveInstall(): Boolean;
          begin
            Result := not IsAutomaticUpdate();
          end;

          function NormalizedExecutablePath(Path: String): String;
          begin
            if Copy(Path, 1, 8) = '\\?\UNC\' then
              Path := '\\' + Copy(Path, 9, Length(Path))
            else if Copy(Path, 1, 4) = '\\?\' then
              Path := Copy(Path, 5, Length(Path));
            Result := ExpandFileName(Path);
            while (Length(Result) > 3) and (Copy(Result, Length(Result), 1) = '\') do
              Delete(Result, Length(Result), 1);
          end;

          function IsTargetExecutable(Path: String): Boolean;
          begin
            Path := NormalizedExecutablePath(Path);
            Result := (CompareText(Path, NormalizedExecutablePath(ExpandConstant('{app}\{#MyAppExeName}'))) = 0)
              or (CompareText(Path, NormalizedExecutablePath(ExpandConstant('{app}\zsclip.exe'))) = 0);
          end;

          procedure FindTargetProcesses(var Targets: TShutdownTargets);
          var
            Window: HWND;
            Process: THandle;
            ProcessId, Size: DWORD;
            Image: String;
            Count: Integer;
          begin
            SetArrayLength(Targets, 0);
            Window := FindMainWindow(0, 0, 'ZsClipMain', 0);
            while Window <> 0 do
            begin
              ProcessId := 0;
              WindowProcessId(Window, ProcessId);
              Process := OpenShutdownProcess($00101000, 0, ProcessId);
              if Process <> 0 then
              begin
                Size := 32768;
                Image := StringOfChar(#0, Size);
                if ProcessImageName(Process, 0, Image, Size) <> 0 then
                begin
                  SetLength(Image, Size);
                  if IsTargetExecutable(Image) then
                  begin
                    Count := GetArrayLength(Targets);
                    SetArrayLength(Targets, Count + 1);
                    Targets[Count].Window := Window;
                    Targets[Count].Process := Process;
                    Targets[Count].ProcessId := ProcessId;
                    Process := 0;
                  end;
                end;
                if Process <> 0 then
                  CloseShutdownHandle(Process);
              end;
              Window := FindMainWindow(0, Window, 'ZsClipMain', 0);
            end;
          end;

          function TargetFileIsWritable(FileName: String): Boolean;
          var
            FileHandle: THandle;
          begin
            Result := True;
            if not FileExists(FileName) then
              Exit;
            { OPEN_EXISTING checks sharing without truncating or changing the executable. }
            FileHandle := OpenReplacementFile(FileName, $40000000, 0, 0, 3, $80, 0);
            Result := FileHandle <> THandle(-1);
            if Result then
              CloseShutdownHandle(FileHandle);
          end;

          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var
            Targets: TShutdownTargets;
            I, Attempt: Integer;
            ProcessId, WaitResult: DWORD;
            AllExited, FilesWritable: Boolean;
          begin
            Result := '';
            NeedsRestart := False;
            if (CompareText(NormalizedExecutablePath(ExpandConstant('{app}')),
                NormalizedExecutablePath(ExpandConstant('{win}'))) = 0)
              or (CompareText(NormalizedExecutablePath(ExpandConstant('{app}')),
                NormalizedExecutablePath(ExpandConstant('{sys}'))) = 0) then
            begin
              Result := '请选择独立的安装目录，不能直接安装到 Windows 系统目录。';
              Exit;
            end;
            FindTargetProcesses(Targets);
            try
              for I := 0 to GetArrayLength(Targets) - 1 do
              begin
                if WaitForShutdown(Targets[I].Process, 0) <> 0 then
                begin
                  ProcessId := 0;
                  WindowProcessId(Targets[I].Window, ProcessId);
                  { Tray Exit saves settings and exits; WM_CLOSE may only hide to the tray. }
                  if ProcessId = Targets[I].ProcessId then
                  begin
                    if PostShutdownMessage(Targets[I].Window, $0111, 40002, 0) = 0 then
                      Log('Tray Exit could not be posted; waiting for the verified process to exit.');
                  end
                  else
                    Log('Verified process window disappeared; waiting for process completion.');
                end;
              end;
              AllExited := False;
              FilesWritable := False;
              for Attempt := 0 to 75 do
              begin
                AllExited := True;
                for I := 0 to GetArrayLength(Targets) - 1 do
                begin
                  WaitResult := WaitForShutdown(Targets[I].Process, 0);
                  if WaitResult <> 0 then
                    AllExited := False;
                end;
                { Exit may start a windowless checkpoint helper using the same executable. }
                if AllExited then
                  FilesWritable := TargetFileIsWritable(ExpandConstant('{app}\{#MyAppExeName}'))
                    and TargetFileIsWritable(ExpandConstant('{app}\zsclip.exe'));
                if AllExited and FilesWritable then
                  Break;
                if Attempt < 75 then
                  Sleep(200);
              end;
              if not AllExited then
              begin
                Result := '剪贴板尚未完全退出，安装已停止以保护现有文件。请从托盘菜单退出后重试。';
                Exit;
              end;
              if not FilesWritable then
                Result := '安装目录中的程序文件仍被占用或无法写入，安装已停止。请关闭该目录中的剪贴板后重试。';
            finally
              for I := 0 to GetArrayLength(Targets) - 1 do
                CloseShutdownHandle(Targets[I].Process);
            end;
          end;

          function GetDefaultInstallDir(Param: string): string;
          begin
            if DirExists('D:\') then
              Result := 'D:\{#MyAppInstallDirName}'
            else if DirExists('E:\') then
              Result := 'E:\{#MyAppInstallDirName}'
            else if DirExists('F:\') then
              Result := 'F:\{#MyAppInstallDirName}'
            else
              Result := ExpandConstant('{autopf}\{#MyAppInstallDirName}');
          end;

          function RunValuePresent(ValueName: string): Boolean;
          var
            Value: string;
          begin
            Result := RegQueryStringValue(HKCU, 'Software\Microsoft\Windows\CurrentVersion\Run', ValueName, Value)
              and (Trim(Value) <> '');
          end;

          function ExistingAutostartEnabled(): Boolean;
          begin
            Result :=
              RunValuePresent('{#MyAppAutoStartValueName}') or
              RunValuePresent('{#MyAppName}') or
              RunValuePresent('Clipboard') or
              RunValuePresent('筑森剪贴');
          end;

          function ShouldDisableAutostart(): Boolean;
          begin
            Result := (not IsAutomaticUpdate()) and (not WizardIsTaskSelected('autostart'));
          end;

          function FindTaskByCaption(Caption: string): Integer;
          var
            I: Integer;
          begin
            Result := -1;
            for I := 0 to WizardForm.TasksList.Items.Count - 1 do
            begin
              if WizardForm.TasksList.ItemCaption[I] = Caption then
              begin
                Result := I;
                Exit;
              end;
            end;
          end;

          procedure CurPageChanged(CurPageID: Integer);
          var
            TaskIndex: Integer;
          begin
            if (CurPageID = wpSelectTasks) and (not AutoStartTaskInitialized) then
            begin
              TaskIndex := FindTaskByCaption('启用开机自启');
              if TaskIndex >= 0 then
                WizardForm.TasksList.Checked[TaskIndex] := ExistingAutostartEnabled();
              AutoStartTaskInitialized := True;
            end;
          end;
          '@
          $installerScript = $installerScript.Replace('__RELEASE_VERSION__', $env:RELEASE_VERSION)
          [System.IO.File]::WriteAllText((Resolve-Path .).Path + '\installer.iss', $installerScript, [System.Text.UTF8Encoding]::new($true))
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss 2>&1 | Tee-Object -FilePath inno-build.log
          if ($LASTEXITCODE -ne 0) {
            $message = (Get-Content inno-build.log -Tail 120) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`n", '%0A').Replace("`r", '%0D')
            Write-Output "::error title=Windows installer build failed::$message"
            exit $LASTEXITCODE
          }
          $status = 1
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Output "cargo build no-lan attempt $attempt/3"
            cargo build --release --locked --no-default-features --features "vv-paste,cloud-sync,mail-merge,ai-actions,sticker"
            $status = $LASTEXITCODE
            if ($status -eq 0) {
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if ($status -ne 0) {
            exit $status
          }
          New-Item -ItemType Directory -Force dist\installer-source-no-lan | Out-Null
          New-Item -ItemType Directory -Force dist\zsclip-windows-x86_64-no-lan | Out-Null
          Copy-Item target\release\zsclip.exe dist\installer-source-no-lan\剪贴板.exe -Force
          Copy-Item dist\installer-source\INSTALL.txt dist\installer-source-no-lan\INSTALL.txt -Force
          Copy-Item target\release\zsclip.exe dist\zsclip-windows-x86_64-no-lan\剪贴板.exe -Force
          $noLanInstallText = @'
          剪贴板 __RELEASE_VERSION__ - Windows 无局域网同步便携版

          安装/运行:
          1. 解压此 zip 到你要长期使用的安装目录，例如 D:\剪贴板。
          2. 双击 剪贴板.exe 运行。
          3. 如果 Windows SmartScreen 提示未知发布者，选择“更多信息”后继续运行。

          说明:
          - 当前包是便携版，不写注册表，不包含安装向导。
          - 此包不包含局域网同步功能，适合不需要局域网发现的环境。
          - 开机自启、托盘、热键等功能在应用设置里启用。
          '@
          $noLanInstallText.Replace('__RELEASE_VERSION__', $env:RELEASE_VERSION) |
            Set-Content -Encoding UTF8 dist\zsclip-windows-x86_64-no-lan\INSTALL.txt
          Compress-Archive -Path dist\zsclip-windows-x86_64-no-lan\* -DestinationPath dist\zsclip-windows-x86_64-no-lan-portable.zip -Force
          $noLanInstaller = (Get-Content installer.iss -Raw).
            Replace('#define MySourceDir "dist\installer-source"', '#define MySourceDir "dist\installer-source-no-lan"').
            Replace('OutputBaseFilename=zsclip-v{#MyAppVersion}-setup', 'OutputBaseFilename=zsclip-v{#MyAppVersion}-setup-no-lan').
            Replace('AppVerName={#MyAppName} {#MyAppVersion}', 'AppVerName={#MyAppName} {#MyAppVersion} 无局域网同步').
            Replace('VersionInfoDescription={#MyAppName}', 'VersionInfoDescription={#MyAppName} 无局域网同步')
          [System.IO.File]::WriteAllText((Resolve-Path .).Path + '\installer-no-lan.iss', $noLanInstaller, [System.Text.UTF8Encoding]::new($true))
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer-no-lan.iss 2>&1 | Tee-Object -FilePath inno-build-no-lan.log
          if ($LASTEXITCODE -ne 0) {
            $message = (Get-Content inno-build-no-lan.log -Tail 120) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`n", '%0A').Replace("`r", '%0D')
            Write-Output "::error title=Windows no-lan installer build failed::$message"
            exit $LASTEXITCODE
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-v${{ needs.prepare.outputs.release_version }}-setup.exe
          path: dist/zsclip-v${{ needs.prepare.outputs.release_version }}-setup.exe
          if-no-files-found: error
      - name: Upload Windows no-lan installer
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-v${{ needs.prepare.outputs.release_version }}-setup-no-lan.exe
          path: dist/zsclip-v${{ needs.prepare.outputs.release_version }}-setup-no-lan.exe
          if-no-files-found: error
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-windows-x86_64-portable.zip
          path: dist/zsclip-windows-x86_64-portable.zip
          if-no-files-found: error
      - name: Upload Windows no-lan portable package
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-windows-x86_64-no-lan-portable.zip
          path: dist/zsclip-windows-x86_64-no-lan-portable.zip
          if-no-files-found: error
      - name: Package resource bundle
        shell: pwsh
        run: |
          $resourceName = "zsclip-v$($env:RELEASE_VERSION)-resources"
          $resourceRoot = "dist\$resourceName"
          if (Test-Path $resourceRoot) {
            Remove-Item -LiteralPath $resourceRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force $resourceRoot | Out-Null
          foreach ($dir in @("assets", "docs", "locales", "integrations")) {
            if (Test-Path $dir) {
              Copy-Item -Path $dir -Destination $resourceRoot -Recurse -Force
            }
          }
          foreach ($file in @("README.md", "README.en.md", "LICENSE", "Cargo.toml", "Cargo.lock")) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $resourceRoot -Force
            }
          }
          Compress-Archive -Path "$resourceRoot\*" -DestinationPath "dist\$resourceName.zip" -Force
      - name: Upload resource bundle
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-v${{ needs.prepare.outputs.release_version }}-resources.zip
          path: dist/zsclip-v${{ needs.prepare.outputs.release_version }}-resources.zip
          if-no-files-found: error

  macos:
    name: macOS release package (${{ matrix.asset_arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      MAC_SHORT_VERSION: ${{ needs.prepare.outputs.mac_short_version }}
      MAC_BUNDLE_VERSION: ${{ needs.prepare.outputs.mac_bundle_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_arch: x86_64
            display_arch: Intel
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_arch: arm64
            display_arch: Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - name: Checkout zsui dependency
        run: |
          revision="$(tr -d '\r\n' < zsui-revision.txt)"
          git init ../zsui
          git -C ../zsui remote add origin https://github.com/qiu7824/zsui
          git -C ../zsui fetch --depth 1 origin "$revision"
          git -C ../zsui checkout --detach FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build macOS release
        env:
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -A warnings
        run: |
          set +e
          status=1
          for attempt in 1 2 3; do
            echo "cargo build attempt $attempt/3"
            cargo build --release --locked --target "${{ matrix.target }}" 2>&1 | tee cargo-build-macos.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ "$status" -ne 0 ]; then
            message="$(grep -n -B 3 -A 12 -E 'error(\[[A-Z0-9]+\])?:|could not compile|cannot find|mismatched types|no method named' cargo-build-macos.log | tail -n 200)"
            if [ -z "$message" ]; then
              message="$(tail -n 160 cargo-build-macos.log)"
            fi
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=macOS cargo build failed::$message"
            exit "$status"
          fi
      - name: Stage macOS binary
        run: |
          mkdir -p dist
          mkdir -p dist/ZSClip.app/Contents/MacOS
          mkdir -p dist/ZSClip.app/Contents/Resources
          cp target/${{ matrix.target }}/release/zsclip dist/ZSClip.app/Contents/MacOS/zsclip
          chmod +x dist/ZSClip.app/Contents/MacOS/zsclip
          mkdir -p dist/AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icons/text/text_256x256.png --out "dist/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" assets/icons/text/text_256x256.png --out "dist/AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns dist/AppIcon.iconset -o dist/ZSClip.app/Contents/Resources/AppIcon.icns
          cat > dist/ZSClip.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>zsclip</string>
            <key>CFBundleIdentifier</key>
            <string>com.zsclip.app</string>
            <key>CFBundleName</key>
            <string>ZSClip</string>
            <key>CFBundleDisplayName</key>
            <string>ZSClip</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>__MAC_SHORT_VERSION__</string>
            <key>CFBundleVersion</key>
            <string>__MAC_BUNDLE_VERSION__</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          sed -i '' \
            -e "s/__MAC_SHORT_VERSION__/${MAC_SHORT_VERSION}/g" \
            -e "s/__MAC_BUNDLE_VERSION__/${MAC_BUNDLE_VERSION}/g" \
            dist/ZSClip.app/Contents/Info.plist
          codesign --force --deep --sign - dist/ZSClip.app
          codesign --verify --deep --strict dist/ZSClip.app
          mkdir -p dist/dmg-root
          cp -R dist/ZSClip.app dist/dmg-root/ZSClip.app
          ln -s /Applications dist/dmg-root/Applications
          cat > dist/dmg-root/INSTALL.txt <<'TXT'
          ZSClip __RELEASE_VERSION__ - macOS ${{ matrix.display_arch }}

          安装/运行:
          1. 打开 DMG。
          2. 将 ZSClip.app 拖到 Applications/应用程序。
          3. 首次运行如果提示无法验证开发者，请右键 ZSClip.app 选择“打开”。

          说明:
          - 当前包使用 ad-hoc 本地签名，未使用 Apple Developer ID 签名，也未公证。
          - 如果测试系统仍提示“已损坏”，请确认下载来源是 GitHub Release；必要时可在终端执行:
            xattr -dr com.apple.quarantine /Applications/ZSClip.app
          - 全局热键、VV 粘贴等系统级能力可能需要在“系统设置 -> 隐私与安全性”里授权辅助功能/输入监控。
          TXT
          sed -i '' "s/__RELEASE_VERSION__/${RELEASE_VERSION}/g" dist/dmg-root/INSTALL.txt
          hdiutil create -volname "ZSClip ${RELEASE_VERSION} ${{ matrix.asset_arch }}" -srcfolder dist/dmg-root -ov -format UDZO dist/zsclip-macos-${{ matrix.asset_arch }}.dmg
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-macos-${{ matrix.asset_arch }}.dmg
          path: dist/zsclip-macos-${{ matrix.asset_arch }}.dmg
          if-no-files-found: error

  linux:
    name: Linux release package
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout zsui dependency
        run: |
          revision="$(tr -d '\r\n' < zsui-revision.txt)"
          git init ../zsui
          git -C ../zsui remote add origin https://github.com/qiu7824/zsui
          git -C ../zsui fetch --depth 1 origin "$revision"
          git -C ../zsui checkout --detach FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libdbus-1-dev \
            libgtk-4-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config
      - name: Build Linux release
        env:
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -A warnings
        run: |
          set +e
          status=1
          for attempt in 1 2 3; do
            echo "cargo build attempt $attempt/3"
            cargo build --release --locked 2>&1 | tee cargo-build-linux.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ "$status" -ne 0 ]; then
            message="$(grep -n -B 3 -A 12 -E 'error(\[[A-Z0-9]+\])?:|could not compile|cannot find|mismatched types|no method named' cargo-build-linux.log | tail -n 200)"
            if [ -z "$message" ]; then
              message="$(tail -n 160 cargo-build-linux.log)"
            fi
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=Linux cargo build failed::$message"
            exit "$status"
          fi
      - name: Stage Linux binary
        run: |
          mkdir -p dist
          mkdir -p dist/zsclip-linux-x86_64/bin
          mkdir -p dist/zsclip-linux-x86_64/share/applications
          cp target/release/zsclip dist/zsclip-linux-x86_64/bin/zsclip
          chmod +x dist/zsclip-linux-x86_64/bin/zsclip
          cat > dist/zsclip-linux-x86_64/share/applications/zsclip.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ZSClip
          Exec=zsclip
          Terminal=false
          Categories=Utility;
          DESKTOP
          cat > dist/zsclip-linux-x86_64/INSTALL.txt <<'TXT'
          ZSClip __RELEASE_VERSION__ - Linux x86_64

          安装/运行:
          1. 解压: tar -xzf zsclip-linux-x86_64.tar.gz
          2. 进入目录: cd zsclip-linux-x86_64
          3. 运行: ./bin/zsclip

          Ubuntu/Debian 运行依赖示例:
          sudo apt install libgtk-4-1 libx11-6 libxi6 libxtst6 dbus-x11

          说明:
          - 当前包是便携 tar.gz，不是 deb/AppImage。
          - 托盘、全局热键、VV 粘贴在 Wayland/X11 下可能需要对应桌面环境权限或工具支持。
          TXT
          sed -i "s/__RELEASE_VERSION__/${RELEASE_VERSION}/g" dist/zsclip-linux-x86_64/INSTALL.txt
          tar -czf dist/zsclip-linux-x86_64.tar.gz -C dist zsclip-linux-x86_64
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/usr/bin
          mkdir -p dist/deb/usr/share/applications
          cp target/release/zsclip dist/deb/usr/bin/zsclip
          chmod +x dist/deb/usr/bin/zsclip
          cp dist/zsclip-linux-x86_64/share/applications/zsclip.desktop dist/deb/usr/share/applications/zsclip.desktop
          cat > dist/deb/DEBIAN/control <<'CONTROL'
          Package: zsclip
          Version: __RELEASE_VERSION__
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libx11-6, libxi6, libxtst6, dbus-x11
          Maintainer: ZSClip
          Description: Native clipboard manager with sync features.
          CONTROL
          sed -i "s/__RELEASE_VERSION__/${RELEASE_VERSION}/g" dist/deb/DEBIAN/control
          dpkg-deb --build dist/deb dist/zsclip-linux-x86_64.deb
      - name: Upload Linux deb package
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-linux-x86_64.deb
          path: dist/zsclip-linux-x86_64.deb
          if-no-files-found: error
      - name: Upload Linux portable package
        uses: actions/upload-artifact@v7
        with:
          name: zsclip-linux-x86_64.tar.gz
          path: dist/zsclip-linux-x86_64.tar.gz
          if-no-files-found: error

